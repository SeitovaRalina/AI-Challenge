# Included from sites-enabled, inside nginx's http block.
limit_req_zone $binary_remote_addr zone=private_ollama:1m rate=12r/m;

server {
    listen 127.0.0.1:11435;
    server_name localhost;
    access_log off;
    client_max_body_size 256k;
    limit_req_status 429;

    location = /api/tags {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:11434;
    }

    location = /api/ps {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:11434;
    }

    location = /api/chat {
        limit_except POST { deny all; }
        limit_req zone=private_ollama burst=5 nodelay;
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location = /v1/chat/completions {
        limit_except POST { deny all; }
        limit_req zone=private_ollama burst=5 nodelay;
        proxy_pass http://127.0.0.1:11434;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / { return 404; }
}
